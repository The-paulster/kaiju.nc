name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Check JavaScript syntax
        shell: pwsh
        run: |
          Get-ChildItem -Path src, test -Recurse -Filter *.js -File | ForEach-Object {
            node --check $_.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Run regression tests
        run: npm test

      - name: Run VS Code example integration tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:integration

      - name: Run VS Code example integration tests (Windows)
        if: runner.os == 'Windows'
        run: npm run test:integration

      - name: Save example screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: example-screenshots-${{ matrix.os }}
          path: .vscode-test/example-workspace-*/screenshots/*.png
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
